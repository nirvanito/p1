        h("td", { "data-label": "Connector" }, h("b", null, cn.connector), h("div", { class: "muted small" }, cn.streams.filter(st => st.count).map(st => streamLabel(st.stream) + " " + st.count.toLocaleString()).join(" · ") || cn.streams.map(st => streamLabel(st.stream)).join(", "))),
        h("td", { "data-label": "Newest record", class: "num" }, cn.latest ? relDay(tsDay(cn.latest)) : "–"),
        h("td", { "data-label": "Last import", class: "num" }, cn.last_run ? relDay(tsDay(cn.last_run)) : "never"),
        h("td", { "data-label": "Status", class: "num" }, state, cn.stale_after_days ? h("div", { class: "muted small" }, "stale after " + cn.stale_after_days + " d") : null));
    });
    parts.push(section("Connectors", null, d.connectors_error ? h("div", { class: "card error" }, d.connectors_error) : null,
      h("div", { class: "list table-wrap" }, h("table", { class: "table stackable" }, h("thead", null, h("tr", null, h("th", null, "Connector"), h("th", { class: "num" }, "Newest record"), h("th", { class: "num" }, "Last import"), h("th", { class: "num" }, "Status"))), h("tbody", null, rows)))));
  }
  if (d.imports.length) {
    parts.push(section("Import runs", d.imports.length, h("div", { class: "list table-wrap" }, h("table", { class: "table stackable" },
      h("thead", null, h("tr", null, h("th", null, "When"), h("th", null, "Connector"), h("th", { class: "num" }, "Added"), h("th", { class: "num" }, "Live"), h("th", null, "Status"))),
      h("tbody", null, d.imports.map(i => h("tr", null,
        h("td", { "data-label": "When" }, fmtDay(tsDay(i.started_at)) + " " + tsTime(i.started_at), h("div", { class: "muted small mono" }, i.uuid.slice(0, 8))),
        h("td", { "data-label": "Connector" }, i.connector, i.source_file ? h("div", { class: "muted small" }, i.source_file) : null),
        h("td", { "data-label": "Added", class: "num" }, String((i.counts && i.counts.added) || 0)),
        h("td", { "data-label": "Live", class: "num" }, String(i.live)),
        h("td", { "data-label": "Status" }, h("span", { class: "badge " + (i.status === "applied" ? "good" : i.status === "retracted" ? "warn" : i.status === "failed" ? "bad" : "") }, i.status)))))))));
  }
  if (d.health_files.length) {
    parts.push(section("Health exports", d.health_files.length, h("div", { class: "list" }, d.health_files.map(f => h("div", { class: "link-row" },
      h("div", { class: "row-main" }, h("div", { class: "row-title" }, f.source_file), h("div", { class: "row-meta" }, plural(f.metrics, "metric") + " · " + fmtDay(f.first_date) + " – " + fmtDay(f.last_date))),
      h("div", { class: "row-side" }, f.records.toLocaleString() + " records"))))));
  }
  if (d.journal.sources.length) {
    parts.push(section("Journal sources", null, h("div", { class: "list" }, d.journal.sources.map(js => h("div", { class: "link-row" },
      h("div", { class: "row-main" }, h("div", { class: "row-title" }, SOURCE_TYPES[js.type] || js.type), h("div", { class: "row-meta" }, "latest " + fmtDay(js.last_date))),
      h("div", { class: "row-side" }, js.count.toLocaleString()))))));
  }
  if (STATUS && STATUS.snapshot) {
    parts.push(h("p", { class: "muted small", style: "margin-top:20px" }, icon("lock"), " Read-only snapshot taken " + tsStamp(STATUS.snapshot.taken_at) + " · refreshed automatically when the database changes" + (STATUS.snapshot.error ? " · last refresh problem: " + STATUS.snapshot.error : "")));
  }
  setView(parts);
}

function tile(label, value, note) {
  return h("div", { class: "tile" }, h("div", { class: "label" }, label), h("div", { class: "value" }, value), note ? h("div", { class: "note" }, note) : null);
}

// ---------------------------------------------------------------- health

async function viewHealth(daysArg) {
  const days = Number(daysArg) || Number(store("healthDays")) || 14;
  const seg = h("div", { class: "seg", role: "group", "aria-label": "Window" }, [14, 30].map(n =>
    h("button", { type: "button", "aria-pressed": String(n === days), onclick: () => { store("healthDays", String(n)); location.hash = "#/health/" + n; } }, n + " days")));
  // The server probed the dashboards at this page's own host name, so the
  // link is offered only where it would open; on a phone with Datasette
  // listening on the laptop's loopback, say why there is none.
  const ds = STATUS && STATUS.dashboards;
  const dash = ds && ds.running
    ? h("a", { class: "btn", href: location.protocol + "//" + location.hostname + ":" + ds.port + "/-/dashboards/health", target: "_blank", rel: "noopener noreferrer" }, "Full dashboards", icon("ext"))
    : ds && ds.local_only
      ? h("span", { class: "muted small" }, "Full dashboards are open on the computer only — start them with ", h("code", null, "lifecrm dashboard --host 0.0.0.0"), " to open them here")
      : null;
  const head = pageHead("Health", "What your phone and watch recorded, beside what you said.", h("div", { class: "row" }, seg, dash));
  setView(head, skeleton(3));
  let d;
  try { d = await api("/api/health?days=" + days); }
  catch (e) { setView(head, errorCard(e)); return; }
  const parts = [head];
  // An export imported weeks ago leaves the window empty; show the same
  // span ending at the newest data instead of a blank page.
  const newest = Object.values(d.latest || {}).sort().pop();
  if (!d.metrics.length && !d.journal.length && newest) {
    try {
      const older = await api("/api/health?days=" + days + "&end=" + newest);
      if (older.metrics.length || older.journal.length) {
        parts.push(h("div", { class: "card muted small", style: "margin-bottom:12px" }, "Nothing in the last " + days + " days — showing the " + days + " days up to your newest health data, " + fmtDay(newest) + "."));
        d = older;
      }
    } catch (e) { /* keep the empty window */ }
  }
  if (d.metrics.length) {
    parts.push(h("div", { class: "chart-grid" }, d.metrics.map(mt => healthCard(mt, d))));
  }
  if (d.workouts && d.workouts.sessions) parts.push(section("Logged workouts", null, h("div", { class: "chart-grid" }, workoutsCard(d.workouts))));
  if (d.nutrition) parts.push(section("Nutrients", null, nutritionCard(d.nutrition)));
  if (d.journal.length) {
    const mood = d.journal.filter(j => j.metric === "mood" || j.metric === "energy");
    const rest = d.journal.filter(j => !(j.metric === "mood" || j.metric === "energy"));
    const cards = [];
    if (mood.length) {
      cards.push(h("div", { class: "card chart-card" }, h("h2", null, mood.map(j => j.label).join(" & ")),
        h("div", { class: "headline" }, mood.map(j => h("span", null, h("span", { class: "big" }, fmtValue(j.latest, "")), h("span", { class: "unit" }, "/10 " + j.label + "  "))), h("span", { class: "sub" }, "from your journal")),
        chart({ start: d.start, end: d.end, kind: "line", unit: "/10", domain: [0, 10], height: 150, label: "mood and energy",
          lines: mood.map((j, i) => ({ name: j.label, short: j.label.slice(0, 1).toUpperCase(), color: i ? "var(--series-2)" : "var(--series-1)", points: j.series })) })));
    }
    for (const j of rest) cards.push(healthCard(j, d, "from your journal"));
    parts.push(section("From your journal", null, h("div", { class: "chart-grid" }, cards)));
  }
  if (!d.metrics.length && !d.journal.length && !(d.workouts && d.workouts.sessions) && !d.nutrition) {
    const latest = Object.entries(d.latest || {}).sort((a, b) => b[1] < a[1] ? -1 : 1)[0];
    parts.push(emptyState("health", latest
      ? "No health data in the last " + days + " days — the newest is " + fmtDay(latest[1]) + "."
      : "No health data yet. Import an export: Health Connect on Android (python -m lifecrm health import <zip>), Apple Health on iPhone — see docs."));
  }
  if (d.missing.length) {
    parts.push(h("p", { class: "muted small", style: "margin-top:16px" }, "Nothing in this window for " + d.missing.map(mm => mm.label + " (latest " + fmtDay(mm.latest) + ")").join(", ") + "."));
  }
  setView(parts);
}

// Workouts per Monday-to-Sunday week from the fitness imports (Strong, Hevy,
// Strava): bars are minutes, the tooltip adds the sessions.
function workoutsCard(w) {
  const weeks = w.weeks.map(x => x.week);
  const last = w.weeks[w.weeks.length - 1];
  return h("div", { class: "card chart-card" },
    h("h2", null, "Workouts per week"),
    h("div", { class: "headline" }, h("span", { class: "big" }, String(last.sessions)), h("span", { class: "unit" }, last.sessions === 1 ? "session" : "sessions"),
      h("span", { class: "sub" }, "week of " + fmtDay(last.week), h("br"), plural(w.sessions, "session") + " · " + fmtValue(w.minutes, "min") + " in " + plural(w.weeks.length, "week"))),
    chart({ start: w.start, end: w.end, dates: weeks, kind: "bar", unit: "min", height: 140, label: "workout minutes per week", hideLegend: true,
      lines: [{ name: "Minutes", color: "var(--series-1)", points: w.weeks.map(x => ({ date: x.week, value: x.minutes })) },
        { name: "Sessions", unit: "", color: "var(--series-2)", points: w.weeks.map(x => ({ date: x.week, value: x.sessions })) }] }),
    h("div", { class: "muted small", style: "margin-top:4px" }, "observed · fitness imports · minutes per week" + (w.latest ? " · newest " + fmtDay(w.latest) : "")));
}

// lifecrm nutrients over the page's window: never advice, and it says so.
function nutritionCard(n) {
  if (n.error) return h("div", { class: "card error" }, n.error);
  const lineOf = x => {
    const ref = x.status === "high" ? "above the " + x.upper_kind + " " + fmtValue(x.upper, x.unit)
      : x.percent.toFixed(0) + "% of the " + x.reference_kind + " " + fmtValue(x.reference, x.unit);
    const src = x.sources.length ? " · most from " + x.sources.map(s => s.food + " " + s.share_percent + "%").join(", ") : "";
    const main = h("div", { class: "row-main" }, h("div", { class: "row-title" }, x.label + " · " + fmtValue(x.average, x.unit) + "/day"), h("div", { class: "row-meta" }, ref + src));
    return x.latest_uuid ? h("a", { class: "link-row", href: "#/obs/" + x.latest_uuid, title: plural(x.rows, "row") + " averaged" }, main, h("div", { class: "row-side" }, plural(x.rows, "row")))
      : h("div", { class: "link-row" }, main);
  };
  const groups = [["low", "Low — below 70% of the reference"], ["borderline", "Borderline — 70–100%"], ["high", "High — average above the upper level"]];
  const body = [];
  for (const [key, title] of groups) {
    if (!n[key].length) continue;
    body.push(h("div", { class: "stream-head" }, title), h("div", { class: "list observed" }, n[key].map(lineOf)));
  }
  const over = n.over_on_some_days.filter(x => x.status !== "high");
  if (over.length) body.push(h("div", { class: "muted small", style: "margin-top:8px" }, "Above the upper level on some days: " + over.map(x => x.label + " (" + plural(x.days_over, "day") + ")").join(", ")));
  if (!body.length && n.days_counted) body.push(h("div", { class: "muted small" }, "Nothing below or above the reference intakes (" + n.meets + " met)."));
  if (!n.days_counted) body.push(h("div", { class: "muted small" }, "No complete day of logging in this window."));
  return h("div", { class: "card" },
    h("p", { class: "small", style: "margin:0 0 10px" }, h("b", null, n.disclaimer)),
    h("div", { class: "muted small", style: "margin-bottom:8px" }, plural(n.days_counted, "day") + " counted, " + fmtDay(n.start) + " – " + fmtDay(n.end) + " · reference intakes for " + n.profile + " · observed"),
    body);
}

function healthCard(mt, d, note) {
  const agg = mt.per_day_agg === "sum" ? "total" : "average";
  return h("div", { class: "card chart-card" },
    h("h2", null, mt.label.charAt(0).toUpperCase() + mt.label.slice(1)),
    h("div", { class: "headline" }, h("span", { class: "big" }, fmtValue(mt.latest, "")), h("span", { class: "unit" }, mt.unit),
      h("span", { class: "sub" }, "latest " + fmtDay(mt.latest_date), h("br"), "avg " + fmtValue(mt.mean, mt.unit) + " per day")),
    metricChart(mt, d.start, d.end, { height: 140 }),
    h("div", { class: "muted small", style: "margin-top:4px" }, (note || (mt.origin === "journal" ? "from your journal" : "sensor import")) + " · daily " + agg + " · " + plural(mt.days, "day")));
}

// ---------------------------------------------------------------- entry & observation

async function viewEntry(uuid) {
  setView(skeleton(3));
  let e;
  try { e = await api("/api/entry/" + encodeURIComponent(uuid)); }
  catch (err) { setView(errorCard(err)); return; }
  const cats = [e.categories.primary].concat(e.categories.secondary || []).filter(Boolean);
  const facts = [];
  const add = (k, v) => { if (v !== null && v !== undefined && v !== "") facts.push(h("dt", null, k), h("dd", null, v)); };
  add("Date", h("a", { href: "#/today/" + e.journal_date }, fmtDay(e.journal_date, { weekday: "long", month: "long" })));
  add("Kind", e.kind);
  add("Category", cats.join(", "));
  add("When", [e.time_of_day, e.occurred_at ? tsStamp(e.occurred_at) : null].filter(Boolean).join(" · "));
  add("Due", e.due_at ? fmtDay(e.due_at) : null);
  add("Closed", e.closure ? e.closure + (e.closed_at ? " · " + fmtDay(tsDay(e.closed_at)) : "") : null);
  add("Confidence", e.confidence !== "high" ? e.confidence : null);
  add("Status", e.status !== "active" ? e.status : null);
  const parts = [
    h("div", { class: "row", style: "margin-bottom:8px" }, kindBadge(e.kind), h("span", { class: "badge good" }, icon("check"), "confirmed")),
    h("h1", null, e.title),
    e.body ? h("p", { style: "font-size:16px;color:var(--text-2)" }, e.body) : null,
    h("div", { class: "card", style: "margin-top:14px" }, h("dl", { class: "kv" }, facts)),
  ];
  const prov = entryProvenance(Object.assign({}, e, { body: null }));
  if (prov.length) parts.push(section("Where it came from", null, h("div", { class: "card" }, prov)));
  if (e.entities.length) parts.push(section("People & things", null, h("div", { class: "row" }, e.entities.map(x => x.type === "person" ? h("a", { class: "chip", href: "#/person/" + x.id }, x.name, h("span", { class: "muted" }, x.role)) : h("span", { class: "chip" }, x.name, h("span", { class: "muted" }, x.type + " · " + x.role))))));
  if (e.measurements.length) parts.push(section("Measurements", null, h("div", { class: "tiles" }, e.measurements.map(m => tile(m.metric.replace(/_/g, " "), fmtValue(m.numeric_value !== null ? m.numeric_value : m.text_value, m.unit || ""), m.status !== "active" ? m.status : null)))));
  const links = [...(e.links.outgoing || []).map(l => ({ ...l, uuid: l.to_uuid, dir: "→" })), ...(e.links.incoming || []).map(l => ({ ...l, uuid: l.from_uuid, dir: "←" }))];
  if (links.length) parts.push(section("Linked entries", links.length, h("div", { class: "list" }, links.map(l => h("a", { class: "link-row", href: "#/entry/" + l.uuid },
    h("span", { class: "badge" }, l.dir + " " + l.type.replace("_", " ")), h("div", { class: "row-main" }, h("div", { class: "row-title" }, l.other_title), h("div", { class: "row-meta" }, fmtDay(l.other_date))))))));
  if (e.revisions.length > 1) parts.push(section("History", e.revisions.length, h("div", { class: "list" }, e.revisions.map(r => h("div", { class: "link-row" }, h("div", { class: "row-main" }, h("div", { class: "row-title" }, r.change_kind.replace(/_/g, " ")), r.note ? h("div", { class: "row-meta" }, r.note) : null), h("div", { class: "row-side" }, r.actor + " · " + fmtDay(tsDay(r.revised_at))))))));
  setView(parts);
}

async function viewObservation(uuid) {
  setView(skeleton(3));
  let o;
  try { o = await api("/api/observation/" + encodeURIComponent(uuid)); }
  catch (err) { setView(errorCard(err)); return; }
  const facts = [];
  const add = (k, v) => { if (v !== null && v !== undefined && v !== "") facts.push(h("dt", null, k), h("dd", null, v)); };
  add("When", (o.local_time || tsStamp(o.started_at)) + (o.ended_at ? " – " + (o.local_end ? o.local_end.slice(11) : tsTime(o.ended_at)) : ""));
  add("Day", h("a", { href: "#/today/" + o.date }, fmtDay(o.date, { weekday: "long", month: "long" })));
  add("Stream", streamLabel(o.stream) + " (" + o.stream + ")");
  add("Who", o.who);
  add("Thread", o.title);
  add("Value", o.value !== null && o.value !== undefined ? fmtValue(o.value, o.unit || "") : null);
  add("App", o.origin_app);
  add("Media", o.media_path);
  add("Status", o.status !== "active" ? o.status : null);
  const people = (o.participants || []).map(p => {
    const label = (p.entity || p.display_name || p.kind + ":" + p.value) + " · " + p.role;
    return p.entity_id ? h("a", { class: "chip", href: "#/person/" + p.entity_id }, label) : h("span", { class: "chip", title: p.kind + ":" + p.value }, label);
  });
  const imp = o.import || {};
  const parts = [
    h("div", { class: "row", style: "margin-bottom:8px" }, observedBadge(), h("span", { class: "badge" }, streamLabel(o.stream))),
    h("h1", { style: "font-size:22px" }, o.who || streamLabel(o.stream)),
    o.text ? h("div", { class: "card", style: "margin-top:14px;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere" }, o.text) : null,
    h("div", { class: "card", style: "margin-top:10px" }, h("dl", { class: "kv" }, facts)),
    people.length ? section("Participants", people.length, h("div", { class: "row" }, people)) : null,
    section("Provenance", null, h("div", { class: "card", style: "background:var(--observed-soft);border:1px dashed var(--observed-border);box-shadow:none" },
      h("p", { class: "small", style: "margin:0 0 8px" }, "Imported in bulk and never reviewed. Cite it; don't take it as a confirmed fact."),
      h("dl", { class: "kv" }, h("dt", null, "Import"), h("dd", { class: "mono" }, imp.uuid || "–"), h("dt", null, "Connector"), h("dd", null, imp.connector || "–"),
        imp.account ? [h("dt", null, "Account"), h("dd", null, imp.account)] : null, imp.source_file ? [h("dt", null, "File"), h("dd", null, imp.source_file)] : null,
        h("dt", null, "Imported"), h("dd", null, tsStamp(imp.started_at)), h("dt", null, "Source id"), h("dd", { class: "mono" }, o.external_id)))),
  ];
  if ((o.cited_by || []).length) parts.push(section("Cited by journal entries", o.cited_by.length, h("div", { class: "list" }, o.cited_by.map(c => h("a", { class: "link-row", href: "#/entry/" + c.uuid }, h("div", { class: "row-main" }, h("div", { class: "row-title" }, c.title), h("div", { class: "row-meta" }, fmtDay(c.date))))))));
  if ((o.context || []).length > 1) parts.push(section("In the same thread", null, h("div", { class: "list observed" }, o.context.map(c => obsRow(c, { showDate: c.date !== o.date })))));
  setView(parts);
}

// ---------------------------------------------------------------- router

const ROUTES = [
  [/^#?\/?$/, () => viewAsk(), "ask"],
  [/^#\/ask(?:\?q=(.*))?$/, q => viewAsk(q ? decodeURIComponent(q) : null), "ask"],
  [/^#\/today(?:\/(\d{4}-\d{2}-\d{2}))?$/, d => viewDay(d), "today"],
  [/^#\/people$/, () => viewPeople(), "people"],
  [/^#\/person\/(\d+)$/, id => viewPerson(id), "people"],
  [/^#\/loops$/, () => viewLoops(), "loops"],
  [/^#\/sources$/, () => viewSources(), "sources"],
  [/^#\/health(?:\/(\d+))?$/, n => viewHealth(n), "health"],
  [/^#\/entry\/([\w-]+)$/, u => viewEntry(u), "today"],
  [/^#\/obs\/([\w-]+)$/, u => viewObservation(u), "today"],
];

function route() {
  hideTip();
  const hash = location.hash || "#/";
  for (const [re, fn, nav] of ROUTES) {
    const m = hash.match(re);
    if (!m) continue;
    document.querySelectorAll(".nav a").forEach(a => { if (a.dataset.route === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    fn(m[1]);
    return;
  }
  setView(emptyState("alert", "No such page.", h("div", { style: "margin-top:10px" }, h("a", { href: "#/ask" }, "Go to Ask"))));
}

function navFoot() {
  const foot = document.getElementById("nav-foot");
  if (!STATUS) return;
  const c = STATUS.counts || {};
  const taken = STATUS.snapshot && STATUS.snapshot.taken_at ? new Date(STATUS.snapshot.taken_at).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "";
  fill(foot, 
    h("div", null, h("span", { class: "dot" }), "read-only · snapshot " + taken),
    h("div", null, (c.entries || 0).toLocaleString() + " entries · " + (c.observations || 0).toLocaleString() + " observed"),
    STATUS.demo ? h("div", { style: "color:var(--warn);margin-top:4px" }, "demo data") : null);
}

async function boot() {
  hydrateIcons(document);
  try { STATUS = await api("/api/status"); }
  catch (e) { setView(errorCard(e)); return; }
  navFoot();
  window.addEventListener("hashchange", route);
  route();
  setInterval(() => api("/api/status").then(st => { STATUS = st; navFoot(); }).catch(() => {}), 60000);
}

boot();
})();
