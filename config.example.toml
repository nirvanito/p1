# Life CRM configuration.
# Easiest: `python -m lifecrm configure` writes config.toml from this file with
# this machine's journal folders and timezone filled in (and creates the
# folders). Or copy this file to config.toml and adjust by hand.
# Every path here, in [paths] and in [connectors.*], follows one rule: '~' is
# your home folder on Windows and macOS alike, and a relative path is relative
# to the project root (never to the folder a command was started from).

[paths]
data_dir = "data"                  # canonical private data (SQLite DB, transcripts, staging)
backups_dir = "backups"            # local DB snapshots
# The VoiceJournal folders the phone saves into (`lifecrm configure` fills these in).
inbox_dir = 'C:\Users\<you>\OneDrive\VoiceJournal\inbox'
inbox_text_dir = 'C:\Users\<you>\OneDrive\VoiceJournal\inbox-text'   # dictated quick notes
archive_dir = 'C:\Users\<you>\OneDrive\VoiceJournal\archive'
cloud_backups_dir = 'C:\Users\<you>\OneDrive\VoiceJournal\backups'  # OneDrive or iCloud Drive; the old name onedrive_backups_dir still works
# On a Mac with an iPhone they live in iCloud Drive (Shortcuts save to a fixed
# folder there, no picker):
# inbox_dir = '~/Library/Mobile Documents/com~apple~CloudDocs/VoiceJournal/inbox'
# inbox_text_dir = '~/Library/Mobile Documents/com~apple~CloudDocs/VoiceJournal/inbox-text'
# archive_dir = '~/Library/Mobile Documents/com~apple~CloudDocs/VoiceJournal/archive'
# cloud_backups_dir = '~/Library/Mobile Documents/com~apple~CloudDocs/VoiceJournal/backups'
# OneDrive on a Mac lives at '~/Library/CloudStorage/OneDrive-Personal/VoiceJournal/...'.
# A Windows PC with an iPhone uses the OneDrive folders above (the iPhone's
# Shortcuts save into OneDrive) — docs/windows-iphone.md.

[time]
timezone = "America/Chicago"       # IANA name; recorded per source at ingest
day_rollover_hour = 5              # recordings before 05:00 local count as the previous day
filename_date = "auto"             # auto | journal | calendar — whose date a recording's filename carries (docs/android.md)

[whisper]
model = "distil-large-v3"          # benchmarked vs "small": same CPU speed, fewer name errors
                                   # (names are what the entity graph is built from);
                                   # drop to "small" only if transcription is too slow for you
device = "cpu"                     # on Apple Silicon too: faster-whisper has no Metal
compute_type = "int8"              # backend, and int8 on the CPU is its fast path
vad_filter = false
language = "en"
# Seeding initial_prompt with known entity names is a marginal aid to roughly the
# first minute of audio only; the alias table is the real fix for misspellings.
seed_initial_prompt = true

[ingest]
# content_hash duplicates WARN (never block); these tolerances drive the soft
# (recorded_at, duration_sec) similarity warning.
duplicate_recorded_at_tolerance_sec = 120
duplicate_duration_tolerance_sec = 5

# Call recordings in the audio inbox are held, never transcribed by intake on
# its own: `lifecrm calls list`, then `calls take <n>` / `calls skip <n>` (or
# /log asks). Optional:
# [intake]
# call_recordings = "ask"           # "ask" (the default) | "auto": transcribe them like any note
# call_patterns = ["acr_*"]         # more name patterns for your recorder app, added to
#                                   # "Call recording*", "Call with *", "Call_*", "Call-*"
#                                   # and Samsung's <name>_yyMMdd_HHmmss

[ask]
# `lifecrm ask` retrieves cited evidence deterministically and always answers
# without a model. Prose answers come from /ask in Claude Code (your own
# Claude account, interactive, checked with `ask --check`). A local model is
# the optional offline route: set enabled = true and run Ollama
# (docs/ask.md) — nothing leaves the machine, nothing is metered.
enabled = false                    # true = let a local Ollama model phrase answers
endpoint = "http://localhost:11434"
model = "llama3.1:8b"              # must be pulled: ollama pull llama3.1:8b
timeout_sec = 120
num_ctx = 8192                     # the model's context window for one answer
default_days = 30                  # window when the question names no time
max_entries = 8                    # entries quoted as evidence
max_passages = 4                   # transcript passages quoted as evidence
max_observations = 6               # imported records (texts, calls, events, ...) quoted as evidence
max_transactions = 10              # transactions listed under a spend answer
max_loops = 10                     # open tasks/plans listed

# ---------------------------------------------------------------- you
# Optional. Your own phone numbers and addresses, as kind:value handles (kind
# is phone, email, calendar, app_account, card or place_id). Records with one
# of them are yours: `ask` says "you" instead of your name, and the web UI's
# People page and the review pack never list you as one of your contacts.
# Texts you sent and an import's own account already say who you are; set
# this when nothing else does — an iPhone Home calendar alone, say.
# (docs/ask.md, "Who you are")
# [owner]
# name = "Your Name"                # optional; who you are is decided by handles only
# handles = ["email:you@example.com", "phone:+15125550100"]

# ---------------------------------------------------------------- connectors
# Optional per-connector settings for `lifecrm observe <name>`. Every key is
# optional; uncomment a table to use it. Each connector's doc lists the rest.

# [connectors.android_sms]          # docs/android-texts.md
# folder = "~/OneDrive/Apps/SMS Backup & Restore"   # where the app uploads
# account = "+15125550100"          # this phone's own number; scopes mirroring
# mirror = true                     # only if your backups do not say type="full"

# [connectors.ios_messages]         # docs/texts.md
# path = "~/Library/Application Support/MobileSync/Backup/<device id>"   # the backup to use when there are several (an iPad's, an old phone's)

# [connectors.whatsapp]             # docs/whatsapp.md
# me = "Your Name"                  # your name as your own lines show it (or a list)
# date_order = "mdy"                # mdy | dmy | ymd — only if the dry run says it had to guess
# timezone = "America/Chicago"      # the phone's zone, if not [time] timezone
# exports_dir = "~/Downloads"       # where exports land when no path is given

# [connectors.calendar]             # docs/calendar.md
# path = "~/Downloads/takeout-20261022T120000Z-001.zip"   # .ics, folder, Takeout or .ical.zip
# account = "you@example.com"       # names the account a multi-calendar export mirrors
# mirror_calendars = ["Home", "Work"]   # one-calendar exports that mirror: names no other calendar of yours has
# horizon_days = 90                 # how far ahead repeating events expand
# exclude_calendars = ["Holidays in United States"]

# [connectors.contacts]             # docs/contacts.md
# path = "~/Downloads/contacts.vcf" # a .vcf, a folder of them, a Takeout zip, or an AddressBook folder
# account = "google:you@example.com"   # set only when you want a vCard's deletions mirrored
# Windows + iPhone: path = "~/Downloads/iCloud Contacts.vcf" (icloud.com › Contacts › Export vCard),
#                   account = "icloud:you@icloud.com"

# [connectors.notes]                # docs/notes.md
# path = "~/OneDrive/Notes/Obsidian"   # a folder, a Keep Takeout zip, or NoteStore.sqlite
# keep_account = "you@gmail.com"    # lets Keep imports mirror deletions when the export cannot say whose it is

# [connectors.finance]              # docs/finance.md
# path = "~/Documents/Statements"   # folder of downloaded statements (needed to run with no path)
# For a bank with no preset, a column mapping (header names in the CSV):
# date_col = "Date"
# description_col = "Description"
# amount_col = "Amount"             # or debit_col / credit_col
# date_format = "%m/%d/%Y"
# sign = "spend_negative"           # or "spend_positive"
# currency = "usd"
# institution = "My Credit Union"
# account = "1234"                  # the card or account's last four
# match = "mycu*.csv"               # which files the mapping applies to
# delimiter = ";"

# [connectors.photos]               # docs/photos.md
# path = "~/OneDrive/Pictures/Samsung Gallery"   # a folder, a Google Photos Takeout, or a Photos library
#                                   # Windows + iPhone: "~/Pictures/iCloud Photos/Photos" (iCloud for Windows)
# include_hidden = false            # Mac Photos library: also import the Hidden album

# [connectors.location]             # docs/location.md
# path = "~/OneDrive/Timeline.json" # Timeline.json, location-history.json, or a Takeout

# [connectors.gps_track]            # docs/gps_track.md
# path = "~/OneDrive/GPSLogger"     # only if the track folder is not OneDrive › GPSLogger (or one folder down)

# [connectors.browser]              # docs/browser.md
# browser = "chrome"                # chrome | brave | edge | safari | chromium | vivaldi | opera
# path = "..."                      # a History / History.db file or a profile folder
# exclude_domains = ["mybank.example"]

# [connectors.email]                # docs/email.md
# addresses = ["you@example.com"]   # yours (else [owner] email handles, else inferred from Sent)
# path = "~/Downloads/takeout-20261022T120000Z-001.zip"   # an .mbox, a folder, a Takeout or ~/Library/Mail
# since = 2020-01-01                # import only mail from this date on
# include_lists = false             # true keeps newsletters and mailing-list mail
# skip_labels = ["Spam", "Trash", "Junk", "Drafts"]   # Gmail labels / mailbox names left out (see the doc for the default list)

# [connectors.meta_messages]        # docs/meta_messages.md
# me = "Your Name"                  # only if the dry run cannot tell which participant is you
# include_requests = false          # true imports message requests too
# platform = "instagram"            # only for an old export that does not say ("messenger" for Facebook)
# exports_dir = "~/Downloads"       # where exports land when no path is given

# [connectors.telegram]             # docs/telegram.md
# me = "user123456789"              # only for a one-chat export that cannot tell (your id or name)
# include_channels = false          # true imports channels and public groups too
# exports_dir = "~/Downloads/Telegram Desktop"

# [connectors.google_activity]      # docs/google_activity.md
# path = "~/Downloads/takeout-20261022T120000Z-001.zip"   # a Takeout zip or folder, or one MyActivity file

# [connectors.fitness]              # docs/fitness.md
# path = "~/Downloads/strong.csv"   # strong.csv, Hevy's workouts.csv, Strava's export_<id>.zip, or a folder
# weight_unit = "lb"                # or "kg": the unit the app is set to (the file does not say)
# distance_unit = "mi"              # or "km"; defaults to mi with lb, km with kg

# [connectors.spotify]              # docs/spotify.md
# path = "~/Downloads/Spotify"      # my_spotify_data.zip, or a folder holding both downloads

# [connectors.reading]              # docs/reading.md
# path = "~/Documents/Kindle/My Clippings.txt"   # or goodreads_library_export.csv, a folder, a .zip

# [connectors.nutrition]            # docs/nutrition.md
# path = "~/Downloads/cronometer"   # servings.csv / dailysummary.csv (Cronometer), a Nutrition Summary (MyFitnessPal), a folder or .zip

# [connectors.linkedin]             # docs/linkedin.md
# profile_url = "https://www.linkedin.com/in/<you>"   # only if the dry run cannot tell which profile is yours
# path = "~/Downloads/Basic_LinkedInDataExport_10-22-2026.zip"

# [connectors.payments]             # docs/payments.md
# path = "~/Documents/Statements"   # Venmo / PayPal .csv files, a folder of them, or a .zip
# me = ["Your Name", "you@example.com"]   # your Venmo name / PayPal email (else [owner])
# venmo_timezone = "UTC"            # only if Venmo's times turn out to be local
# paypal_date_order = "mdy"         # mdy | dmy — only if the dry run says it had to guess

# [connectors.rides]                # docs/rides.md
# path = "~/Downloads/Uber Data.zip"   # Uber's export zip, its folder, or trips_data.csv
# currency = "usd"                  # Uber Eats' file names none: default is the trips' own

# ---------------------------------------------------------------- collect
# Optional — you need none of it. The daily job (`lifecrm collect`,
# scripts/collect.*, 06:30) finds every source on this computer by itself,
# each where its connector looks with no path given (the [connectors.*]
# settings above still apply); routine changes are applied, and a new source,
# a large removal or records the reader cannot validate wait for your yes in
# /morning (docs/collect.md). `collect decline <source>` is a no for good.
# [collect]
# sources = ["android_sms", "health"]   # only these, and nothing else is looked at
# health_dir = "D:/Exports/Health Connect"   # one more folder for the phone's health export
#
# Online sources (Google Calendar, Gmail, Google Contacts, Last.fm) need nothing
# here: `python -m lifecrm connect <service>` keeps what each needs in
# data/secrets.json, never in this file (docs/online.md).

# ---------------------------------------------------------------- nutrition
# Optional. Whose reference intakes `lifecrm nutrients` compares against
# (docs/nutrition.md). Unset, each value is the higher of the female and male
# figure for ages 19-50, and the report says so.
# [nutrition]
# sex = "female"                    # "female" | "male"
# age = 32                          # whole years, 19 or over

# ---------------------------------------------------------------- front ends
# Optional. The values shown are the defaults, except [obsidian] vault and
# [voice] voice and piper_model, which are examples (by default there is no
# vault, the OS's own voice is used and Piper is off).

# [gui]                             # `lifecrm open` opens the main GUI
# main = "web"                      # "web" (lifecrm serve) | "obsidian" (the vault)

# [obsidian]                        # the vault as a GUI (docs/obsidian.md)
# vault = "~/OneDrive/LifeCRM vault"  # Mac: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/LifeCRM"
# auto_refresh = true               # re-export after every command that changes the database

# [web]                             # `lifecrm serve` (docs/web.md)
# host = "127.0.0.1"                # 0.0.0.0 for the phone on the same Wi-Fi
# port = 8765
# token = ""                        # "random" makes one up at each start
# log_questions = true              # record questions in recall_log
# use_llm = true                    # let a local model phrase answers, when [ask] enabled = true
# model = "small"                   # whisper model for voice questions in the page
# refresh_seconds = 3               # how often to check the live DB for changes
# dashboard_port = 8001             # where `lifecrm dashboard` listens, for the link
# allowed_hosts = []                # extra Host names to accept

# [voice]                           # `lifecrm voice` (docs/voice.md); extras: requirements-voice.txt
# model = "small"                   # whisper model for voice turns: latency first
# use_llm = true                    # phrase answers with the [ask] model, when [ask] enabled = true
# speak = true
# voice = "Samantha"                # say -v name (macOS) or SAPI voice name (Windows)
# max_spoken_chars = 400
# piper_model = "~/voices/en_US-lessac-medium.onnx"
# wake_model = "hey_jarvis"
# docs/voice.md lists the rest: llm_model, vad_filter, device, wake_threshold,
# silence_rms, silence_sec, max_record_sec.

# [review]                          # `lifecrm review` (docs/review.md)
# quiet_weeks = 3                   # relationships: people not contacted for this many weeks

# [assistant]                       # `lifecrm nudges`, `lifecrm reminders` (docs/assistant.md)
# due_days = 7                      # a task or plan due within this many days is a nudge
# birthday_days = 14                # a linked contact card's birthday within this many days
# nutrient_days = 14                # the food-diary window for "below reference" nudges
# follow_up_days = 3                # an incoming message this old with no later contact is a follow-up
# follow_up_window = 30             # how far back follow-ups look
# lapsed_days = 180                 # the history a person's own contact rhythm is learned from
# drift_recent = 7                  # drift: the last N days ...
# drift_baseline = 30               # ... against the N days before them
# patterns = "off"                  # "on" puts the EXPERIMENTAL pattern finder in nudges, review and /morning (docs/patterns.md)
# pattern_series = []               # extra series keys for it (docs/assistant.md lists them)
# pattern_days = 90                 # its window
# reminders_dir = "~/OneDrive/LifeCRM reminders"  # a synced folder the phone's calendar reads; unset = no calendar
# reminder_hour = 9                 # local hour a due item's calendar alarm fires
# auto_publish = true               # republish the calendar after every command that changes the database

# [features]                        # the read-side features, checked or unchecked by `lifecrm features` (docs/features.md); a key not listed is on
# on_this_day = true                # earlier years' entries and records on today's date
# meeting_prep = true               # before a meeting: last contact, open loops, recent messages, birthday
# places = true                     # town names from a local GeoNames file, trips, countries (needs `lifecrm places fetch`)
# journal_prompts = true            # a day's moments worth a word in the journal (a prompt, never an entry)
# subscriptions = true              # recurring charges, new ones, price rises
# experiments = true                # plans with data.experiment, measured before and during
# search = true                     # every match across the journal and the imports, with facets
# job_changes = true                # a linked person's LinkedIn position changed between two exports
# year_review = true                # `lifecrm review --year YYYY` (the year lens)
# link_memory = true                # where a link or a site turned up, and who sent it
# gift_ideas = true                 # gift ideas beside a birthday; anniversaries as nudges
# conversations = true              # one thread per person across texts, chats and email
# weekday_profile = true            # each series averaged by day of the week
# highlights = true                 # a few book highlights a day, in a fixed rotation

# [places]                          # the places feature (docs/places.md)
# gazetteer = "data/geo/places.tsv" # what `lifecrm places fetch` writes; or any GeoNames cities*.txt
# home = "30.27, -97.74"            # a fixed home instead of "where most days are"
# trip_km = 100                     # a day with a record farther than this from home is away
# max_km = 50                       # a position farther than this from every town gets no name
